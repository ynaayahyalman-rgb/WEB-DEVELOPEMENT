<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Syntax Guide and Commenting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background: linear-gradient(to right, lightblue, lightgreen);
        }
        .comment-section {
            margin-top: 20px;
        }
        .comment {
            background-color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .comment .author {
            font-weight: bold;
        }
        .comment .text {
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1 id="text-center mt-4"></h1>
    <p id="text-center"></p>
<script>
    document.getElementById('text-center mt-4').textContent = 'Bootstrap Syntax Guide and Commenting';
    </script>
</html>
