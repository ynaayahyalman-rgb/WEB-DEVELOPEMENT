<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Methods Example</title>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">JavaScript Methods Example</h1>
        <p id="demo"></p>

        <script>
            // Example of a JavaScript method
            const person = {
                firstName: "John",
                lastName: "Doe",
                fullName: function() {
                    return this.firstName + " " + this.lastName;
                }
            };

            document.getElementById("demo").innerHTML = person.fullName();
        </script>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }   
    </style>
    <script>
        // Additional JavaScript code can be added here
       var str = " World!";
         var result = "Hello".concat(str);
            console.log(result); // Output: "Hello World!"
            document.write(str.toUpperCase());
            document.write("<br>");
            document.write(str.toLowerCase());
            document.write("<br>");
            document.write(str.length);
            document.write("<br>");
            document.write(str.indexOf("o"));
            document.write("<br>");
            document.write(str.slice(1, 5));
            document.write("<br>");
            document.write(str.replace("World", "JavaScript"));
    </script>
</body>
</html>
