<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Syntax Guide and Commenting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background: linear-gradient(to right, lightblue, lightgreen);
        }
        .comment-section {
            margin-top: 20px;
        }
        .comment {
            background-color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .comment .author {
            font-weight: bold;
        }
        .comment .text {
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1 id="text-center mt-4"></h1>
    <p id="text-center"></p>
    <div class="comment-section container">
        <h2>Comments</h2>
        <div class="comment">
            <div class="author">Alice</div>
            <div class="text">This
    is a great guide on JavaScript syntax and commenting!</div>
        </div>
        <div class="comment">
            <div class="author">Bob</div>
            <div class="text">I found the examples very helpful. Thanks for sharing!</div>
        </div>
    </div>
<script>
    var num1=35;
    var num2=15;
    var sum=num1+num2;
    document.getElementById('text-center mt-4').textContent = 'Bootstrap Syntax Guide and Commenting';
    document.getElementById('text-center').textContent = 'The sum of ' +
    num1 + ' and ' + num2 + ' is: ' + sum;
    var titleElement = document.querySelector('title');
    titleElement.textContent = 'Bootstrap Syntax Guide and Commenting';
</script>
</html>
