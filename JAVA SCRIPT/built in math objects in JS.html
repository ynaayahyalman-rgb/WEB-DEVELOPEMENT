<!DOCTYPE html> 
<html>
<body>
<p id="demo"></p>
<script>
var x = 4;
var y = 3;
document.getElementById("demo").innerHTML = "The value of x is: " + x + "<br>" +
"Math.PI: "
+ Math.PI + "<br>" +
"Math.round(4.7): " + Math.round(4.7) + "<br>" +
"Math.round(4.4): " + Math.round(4.4) + "<br>" +
"Math.pow(8, 2): " + Math.pow(8, 2) + "<br>" +
"Math.sqrt(64): " + Math.sqrt(64) + "<br>" +
"Math.abs(-4.7): " + Math.abs(-4.7) + "<br>" +
"Math.ceil(4.4): " + Math.ceil(4.4) + "<br>" +
"Math.floor(4.7): " + Math.floor(4.7) + "<br>" +
"Math.max(5, 10): " + Math.max(5, 10)   + "<br>" +
"Math.min(5, 10): " + Math.min(5, 10)   + "<br>" +
"Math.random(): " + Math.random() + "<br>" +
"Math.sign(-4.7): " + Math.sign(-4.7) + "<br>" +
"Math.sign(0): " + Math.sign(0) + "<br>" +
"Math.sign(4.7): " + Math.sign(4.7) + "<br>" +
"Math.trunc(4.7): " + Math.trunc(4.7) + "<br>" +
"Math.trunc(-4.7): " + Math.trunc(-4.7) + "<br>" +
"x += y: " + (x += y) + "<br>" +
"x -= y: " + (x -= y) + "<br>" +
"x *= y: " + (x *= y) + "<br>" +
"x /= y: " + (x /= y) + "<br>" +"x %= y: " + (x %= y) + "<br>" +
"x **= y : " + (x **= y) + "<br>";
</script>
</body>
</html>
