<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Real-Time Validation Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 320px;
    }

    h2 {
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .error {
      color: red;
      font-size: 12px;
    }

    .success {
      color: green;
      font-size: 12px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #28a745;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:disabled {
      background: gray;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Register</h2>

  <div class="form-group">
    <label>Username</label>
    <input type="text" id="username">
    <div id="userMsg"></div>
  </div>

  <div class="form-group">
    <label>Email</label>
    <input type="text" id="email">
    <div id="emailMsg"></div>
  </div>

  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password">
    <div id="passMsg"></div>
  </div>

  <div class="form-group">
    <label>Confirm Password</label>
    <input type="password" id="confirmPassword">
    <div id="confirmMsg"></div>
  </div>

  <button id="submitBtn" disabled>Submit</button>
</div>

<script src ="script.js"></script>
 
</script>

</body>
</html>
