<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Scrollspy Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            position: relative;
        }
        .section {
            height: 100vh;
            padding: 20px;
        }
        #section1 { background-color: #f8f9fa; }
        #section2 { background-color: #e9ecef; }
        #section3 { background-color: #dee2e6; }
    </style>
</head>
<body data-bs-spy="scroll" data-bs-target="#navbar-example" data-bs-offset="0" tabindex="0">
    <nav id="navbar-example" class="navbar navbar-light bg-light fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Scrollspy</a>
            <ul class="nav nav-pills">
                <li class="nav-item">
                    <a class="nav-link" href="#section1">Section 1</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#section2">Section 2</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#section3">Section 3</a>
                </li>
            </ul>
        </div>
    </nav>

    <div id="section1" class="section">
        <h1>Section 1</h1>
        <p>This is the first section.</p>
    </div>
    <div id="section2" class="section">
        <h1>Section 2</h1>
        <p>This is the second section.</p>
    </div>
    <div id="section3" class="section">
        <h1>Section 3</h1>
        <p>This is the third section.</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
<style>
    body {
        position: relative;
    }
    .section {
        height: 100vh;
        padding: 20px;
    }
    #section1 { background-color: #3585d4; }
    #section2 { background-color: #e5ff00; }
    #section3 { background-color: #36e644; }
</style>
</html>
