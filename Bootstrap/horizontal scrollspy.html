<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Horizontal Scrollspy Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background: linear-gradient(to right, red, yellow, green);
        }
        .nav-link {
            color: white;
        }
        .nav-link.active {
            font-weight: bold;
            color: black;
        }
        .scrollspy-example {
            position: relative;
            height: 200px;
            margin-top: 10px;
            overflow: auto;
        }
        .scrollspy-example .list-group-item {
            height: 100px;
        }
    </style>
</head>
<body data-bs-spy="scroll" data-bs-target="#navbar-example2" data-bs-offset
="0" tabindex="0">
    <nav id="navbar-example2" class="navbar navbar-light bg-light px-3">
        <a class="navbar-brand" href="#">Scrollspy</a>
        <ul class="nav nav-pills">
            <li class="nav-item">
                <a class="nav-link" href="#item-1">Item 1</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#item-2">Item 2</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#item-3">Item 3</a>
            </li>
        </ul>
    </nav>
    <div class="scrollspy-example">
        <div id="item-1" class="list-group
-item">
            <h4>Item 1</h4>
            <p>This is the content for item 1.</p>
        </div>
        <div id="item-2" class="list-group-item">
            <h4>Item 2</h4>
            <p>This is the content for item 2.</p>  
        </div>
        <div id="item-3" class="list-group-item">
            <h4>Item 3</h4>
            <p>This is the content for item 3.</p>
        </div>
    </div>
</body>
</html>
