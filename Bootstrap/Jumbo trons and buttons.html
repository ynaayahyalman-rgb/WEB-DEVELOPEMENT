<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Jumbotron and Buttons Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="jumbotron bg-light p-5 rounded shadow">
        <h1 class="display-4">Welcome to Bootstrap!</h1>
        <p class="lead">This is a simple jumbotron example to showcase Bootstrap's styling and components.</p>
        <hr class="my-4">
        <p>Bootstrap makes it easy to create responsive and stylish web pages with its pre-built components and utilities.</p>
        <a class="btn btn-primary btn-lg" href="#" role="button">Learn more</a>
    </div>
     <style>
            body {
                background: linear-gradient(to right, rgb(255, 0, 0), rgb(255, 165, 0), rgb(255, 255, 0));
            } 
        </style>
</body>
</html>
