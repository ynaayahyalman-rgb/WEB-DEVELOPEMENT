<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Grid</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .box {
            background-color: lightblue;
            border: 2px solid navy;
            text-align: center;
            padding: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container mt-4">
    <h2 class="text-center">Bootstrap Grid Example</h2>

    <!-- Row 1 -->
    <div class="row">
        <div class="col box">Column 1</div>
        <div class="col box">Column 2</div>
        <div class="col box">Column 3</div>
    </div>

    <!-- Row 2 -->
    <div class="row mt-3">
        <div class="col-6 box">Column 1 (6 columns)</div>
        <div class="col-6 box">Column 2 (6 columns)</div>
    </div>
</div>

</body>
</html>
